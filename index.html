<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Fitness Pro Ultimate</title>
    <style>
        :root {
            --bg-main: #0f1115;
            --bg-card: #181c24;
            --bg-nav: #12141c;
            --primary: #ff3838;
            --primary-glow: rgba(255, 56, 56, 0.2);
            --accent: #00d2d3;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --border: #222834;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 90px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* CONFIGURAÇÃO / SETUP */
        .setup-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            margin-top: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .brand-logo {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .brand-logo span { color: var(--primary); }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%;
            background: var(--bg-main);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .btn-primary {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        /* APP PRINCIPAL */
        #screen-app { display: none; }

        .profile-widget {
            background: linear-gradient(135deg, #1e2430, #141821);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge-goal {
            background: rgba(0, 210, 211, 0.1);
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        /* SUB-MENU ABC */
        .abc-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .abc-btn {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .abc-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .section-title {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 15px 0;
            font-weight: 700;
        }

        /* CARDS DE EXERCÍCIO */
        .exercise-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .exercise-hero {
            display: flex;
            padding: 16px;
            gap: 16px;
            align-items: center;
        }

        /* AVATAR VETORIAL DO BONECO MUDADO EM REAL-TIME VIA SVG */
        .exercise-visual-box {
            width: 75px;
            height: 75px;
            background-color: var(--bg-main);
            border-radius: 12px;
            flex-shrink: 0;
            border: 1px solid var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .exercise-visual-box svg {
            width: 45px;
            height: 45px;
            fill: none;
            stroke: var(--text-muted);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .exercise-detail { flex: 1; }
        .exercise-detail h4 { font-size: 1.05rem; font-weight: 600; margin-bottom: 4px; }
        .exercise-detail p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.3; }

        .exercise-footer {
            background: rgba(0, 0, 0, 0.15);
            padding: 10px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .meta-tag { font-size: 0.8rem; font-weight: 700; color: var(--primary); }
        
        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn-action-ex {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* MODAIS */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 450px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-preview-icon {
            width: 100%;
            height: 120px;
            background: var(--bg-main);
            border-radius: 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--border);
        }

        .modal-preview-icon svg {
            width: 70px;
            height: 70px;
            fill: none;
            stroke: var(--primary);
            stroke-width: 2;
        }

        .ai-guide-box {
            background: var(--bg-main);
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border-left: 3px solid var(--accent);
        }

        .ai-guide-box h5 {
            color: var(--accent);
            margin-bottom: 5px;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .ai-guide-box p {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* TIMER */
        .hub-timer {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            margin-top: 25px;
        }

        .timer-val { font-size: 2.5rem; font-weight: 800; font-family: monospace; margin: 5px 0; }
        .timer-actions { display: flex; gap: 8px; justify-content: center; }

        .btn-sec {
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: white;
            padding: 8px 16px;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
        }

        /* NAV INFERIOR */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 70px;
            background: var(--bg-nav);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            gap: 4px;
        }

        .nav-item.active { color: var(--primary); }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
    </style>
</head>
<body>

    <div class="container">
        <div id="screen-setup" class="setup-card">
            <div class="brand-logo">Hybrid<span>Fitness</span></div>
            <form onsubmit="initApp(event)">
                <div class="form-group">
                    <label>Nome do Atleta</label>
                    <input type="text" id="in-name" required placeholder="Digite seu nome">
                </div>
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Peso (kg)</label>
                        <input type="number" id="in-weight" required placeholder="78">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Altura (m)</label>
                        <input type="number" id="in-height" step="0.01" required placeholder="1.64">
                    </div>
                </div>
                <div class="form-group">
                    <label>Objetivo</label>
                    <select id="in-goal">
                        <option value="Hipertrofia">💪 Hipertrofia Acelerada</option>
                        <option value="Definição">🔥 Queima & Definição</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Montar Painel de Treino</button>
            </form>
        </div>

        <div id="screen-app">
            <div class="profile-widget">
                <div>
                    <h3 id="user-name">Atleta</h3>
                    <p id="user-stats">00kg | 0.00m</p>
                </div>
                <div class="badge-goal" id="user-goal">Objetivo</div>
            </div>

            <div class="abc-tabs">
                <button class="abc-btn active" id="btn-A" onclick="changeDay('A')">TREINO A</button>
                <button class="abc-btn" id="btn-B" onclick="changeDay('B')">TREINO B</button>
                <button class="abc-btn" id="btn-C" onclick="changeDay('C')">TREINO C</button>
            </div>

            <div id="workout-container">
                </div>

            <div class="hub-timer">
                <span style="font-size: 0.75rem; color: var(--text-muted); font-weight:700; text-transform:uppercase;">Recuperação</span>
                <div class="timer-val" id="timer-display">01:00</div>
                <div class="timer-actions">
                    <button class="btn-sec" onclick="runTimer(60)">60s</button>
                    <button class="btn-sec" onclick="runTimer(90)">90s</button>
                    <button class="btn-sec" style="color: var(--primary)" onclick="clearTimer()">Reset</button>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav" id="app-nav" style="display: none;">
        <button class="nav-item active" id="nav-casa" onclick="changeEnvironment('casa')">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Casa
        </button>
        <button class="nav-item" id="nav-academia" onclick="changeEnvironment('academia')">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg> Academia
        </button>
    </div>

    <div class="modal" id="guide-modal">
        <div class="modal-content">
            <h3 id="guide-title" style="color: var(--primary); margin-bottom: 10px;">Execução</h3>
            <div class="modal-preview-icon" id="guide-vector-container">
                </div>
            
            <div class="ai-guide-box">
                <h5>1. Posição Inicial</h5>
                <p id="guide-step1">Carregando orientação...</p>
            </div>
            <div class="ai-guide-box">
                <h5>2. Movimento Retilíneo</h5>
                <p id="guide-step2">Carregando orientação...</p>
            </div>
            <div class="ai-guide-box">
                <h5>⚠️ Erro Comum a Evitar</h5>
                <p id="guide-step3" style="color: #ff4757;"></p>
            </div>
            <button class="btn-primary" onclick="closeGuideModal()">Entendido, Começar!</button>
        </div>
    </div>

    <div class="modal" id="edit-modal">
        <div class="modal-content">
            <h3 style="margin-bottom: 15px; color: var(--primary);">Substituir Exercício</h3>
            <div class="form-group">
                <label>Selecione o novo exercício</label>
                <select id="modal-select-ex"></select>
            </div>
            <div class="form-group">
                <label>Séries e Repetições</label>
                <input type="text" id="modal-input-meta">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn-primary" style="flex: 1;" onclick="saveExerciseEdit()">Salvar</button>
                <button class="btn-sec" onclick="closeModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        // BANCO DE DESIGN DE VETORES INTEGRADAS (BONECOS MINIMALISTAS EM SVG)
        const bonecoVectors = {
            push: `<svg viewBox="0 0 24 24"><path d="M19 14l-4-4M5 14l4-4M12 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm-6 14h12M9 11h6v3H9z"/></svg>`,
            pull: `<svg viewBox="0 0 24 24"><path d="M12 5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm-5 4h10v2H7zm2 4h6v6H9zM3 19h18"/></svg>`,
            legs: `<svg viewBox="0 0 24 24"><path d="M12 3a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm-3 5h6v4H9zm-1 6h3v5H8zm5 0h3v5h-3z"/></svg>`
        };

        const exerciseBank = {
            push: [
                { name: "Flexão de Braço Padrão", desc: "Mantenha o corpo reto e desça até o peito quase tocar o chão.", vector: bonecoVectors.push, step1: "Mãos no chão alinhadas com o peitoral, pés juntos e abdômen totalmente contraído.", step2: "Desça flexionando os cotovelos para trás (em ângulo de 45°), até o queixo se aproximar do solo.", step3: "Deixar o quadril cair ou relaxar o abdômen durante a execução." },
                { name: "Supino Reto com Barra", desc: "Desça a barra controladamente até o peito e empurre com força explosiva.", vector: bonecoVectors.push, step1: "Deitado no banco, escápulas totalmente aduzidas (fechadas atrás), pés firmes empurrando o chão.", step2: "Retire a barra, desça controladamente até tocar levemente a linha dos mamilos e suba estendendo os braços.", step3: "Retirar as costas do banco e bater a barra com impacto contra o peito." },
                { name: "Supino Inclinado com Halteres", desc: "Foco na porção superior do peito. Angulação de 30 a 45 graus.", vector: bonecoVectors.push, step1: "Banco inclinado a 30°. Halteres posicionados nas laterais do peitoral superior.", step2: "Empurre os halteres verticalmente aproximando-os no topo sem bater os pesos. Controle a descida.", step3: "Inclinar demais o banco (acima de 45°), jogando toda a força nos ombros anteriores." },
                { name: "Desenvolvimento de Ombros", desc: "Empurre os halteres acima da cabeça estendendo os braços.", vector: bonecoVectors.push, step1: "Sentado com a coluna totalmente apoiada. Halteres na altura das orelhas.", step2: "Suba os pesos em linha reta até quase estender os braços, mantendo o controle total da trajetória.", step3: "Arquear excessivamente a lombar para tentar compensar o excesso de peso." },
                { name: "Elevação Lateral", desc: "Suba os braços até a linha dos ombros focando na lateral do deltoide.", vector: bonecoVectors.push, step1: "Postura ereta, joelhos levemente flexionados, halteres posicionados ao lado das coxas.", step2: "Eleve os braços lateralmente até a altura dos ombros, liderando o movimento com os cotovelos.", step3: "Lançar o corpo para trás usando impulso ou subir os pesos acima da linha da cabeça." }
            ],
            pull: [
                { name: "Barra Fixa Pronada", desc: "Puxe o corpo para cima até o queixo passar a linha da barra.", vector: bonecoVectors.pull, step1: "Segure a barra com as palmas para a frente, braços totalmente estendidos pendurado.", step2: "Puxe o corpo para cima direcionando o peito para a barra e fechando as escápulas atrás.", step3: "Ficar balançando as pernas (chute) para subir sem usar a força das costas." },
                { name: "Puxada Alta no Pulley", desc: "Puxe a barra em direção ao peitoral esmagando as costas.", vector: bonecoVectors.pull, step1: "Sentado com as pernas firmes sob o suporte. Pegada aberta na barra pronada.", step2: "Incline o tronco minimamente para trás e puxe a barra até a altura do peito.", step3: "Descer a barra até o abdômen jogando o peso usando o momentum do corpo inteiro." },
                { name: "Remada Baixa Triângulo", desc: "Mantenha a postura reta e puxe a carga em direção ao abdômen.", vector: bonecoVectors.pull, step1: "Pés apoiados, joelhos semicoflexionados, coluna perfeitamente alinhada segurando o triângulo.", step2: "Puxe o peso em direção ao umbigo direcionando os cotovelos bem rente ao corpo.", step3: "Arredondar a coluna inteira durante a fase de alongamento do cabo." },
                { name: "Remada Curvada", desc: "Incline o tronco à frente e puxe a barra trabalhando toda a dorsal.", vector: bonecoVectors.pull, step1: "Pés na largura dos ombros, incline o tronco à frente mantendo a coluna retilínea estável.", step2: "Puxe a barra em direção à boca do estômago apontando os cotovelos para o teto.", step3: "Subir o tronco durante o movimento transformando o exercício em um encolhimento de ombro." }
            ],
            legs: [
                { name: "Agachamento Livre", desc: "Desça o quadril para trás mantendo os joelhos alinhados.", vector: bonecoVectors.legs, step1: "Barra firme sobre o trapézio, pés afastados na largura dos ombros com pontas levemente para fora.", step2: "Inicie projetando o quadril para trás como se fosse sentar, descendo de forma profunda.", step3: "Deixar os joelhos convergirem para dentro ou tirar os calcanhares do chão." },
                { name: "Agachamento Búlgaro", desc: "Um pé apoiado atrás. Desça verticalmente concentrando a força na perna da frente.", vector: bonecoVectors.legs, step1: "Um pé firme à frente e o outro apoiado atrás sobre um banco ou ponto elevado estável.", step2: "Desça o joelho de trás verticalmente em direção ao chão até que a coxa da frente fique paralela ao solo.", step3: "Projetar o joelho da frente muito além da linha dos dedos gerando estresse excessivo." },
                { name: "Leg Press 45°", desc: "Empurre a plataforma mantendo a lombar totalmente apoiada no banco.", vector: bonecoVectors.legs, step1: "Sentado com a lombar e o quadril totalmente colados no encosto, pés bem distribuídos na plataforma.", step2: "Destrave a carga e desça trazendo os joelhos em direção ao peito de forma controlada, empurre.", step3: "Estender totalmente as pernas no final travando a articulação dos joelhos." }
            ]
        };

        let currentEnvironment = "casa";
        let currentDay = "A";
        let currentEditingIndex = null;

        let userRoutine = {
            casa: {
                A: [
                    { ...exerciseBank.push[0], meta: "4 SÉRIES x FALHA" },
                    { ...exerciseBank.push[4], meta: "3 SÉRIES x 12 REPS" },
                    { ...exerciseBank.pull[0], meta: "4 SÉRIES x 8-12 REPS" },
                    { ...exerciseBank.pull[3], meta: "3 SÉRIES x 15 REPS" }
                ],
                B: [
                    { ...exerciseBank.legs[1], meta: "4 SÉRIES x 12 REPS" },
                    { ...exerciseBank.legs[0], meta: "4 SÉRIES x 20 REPS" },
                    { ...exerciseBank.legs[2], meta: "3 SÉRIES x 15 REPS" }
                ],
                C: [
                    { name: "Abdominal Remador", desc: "Estique o corpo e suba flexionando o tronco e abraçando os joelhos.", vector: bonecoVectors.pull, step1: "Deitado de costas no chão com braços e pernas totalmente estendidos.", step2: "Suba o tronco soltando o ar e flexionando os joelhos até alinhar com o peito.", step3: "Forçar excessivamente o pescoço para a frente ao invés de usar a força do core.", meta: "4 SÉRIES x 20 REPS" },
                    { ...exerciseBank.push[0], meta: "4 SÉRIES x 15 REPS" }
                ]
            },
            academia: {
                A: [
                    { ...exerciseBank.push[1], meta: "4 SÉRIES x 10 REPS" },
                    { ...exerciseBank.push[2], meta: "3 SÉRIES x 12 REPS" },
                    { ...exerciseBank.push[3], meta: "4 SÉRIES x 10 REPS" },
                    { ...exerciseBank.push[4], meta: "4 SÉRIES x 12 REPS" }
                ],
                B: [
                    { ...exerciseBank.pull[1], meta: "4 SÉRIES x 10 REPS" },
                    { ...exerciseBank.pull[2], meta: "4 SÉRIES x 12 REPS" },
                    { ...exerciseBank.pull[3], meta: "3 SÉRIES x 10 REPS" }
                ],
                C: [
                    { ...exerciseBank.legs[0], meta: "4 SÉRIES x 8-10 REPS" },
                    { ...exerciseBank.legs[2], meta: "4 SÉRIES x 12 REPS" }
                ]
            }
        };

        function initApp(e) {
            e.preventDefault();
            document.getElementById('user-name').textContent = document.getElementById('in-name').value;
            document.getElementById('user-stats').textContent = `${document.getElementById('in-weight').value} kg | ${document.getElementById('in-height').value} m`;
            document.getElementById('user-goal').textContent = document.getElementById('in-goal').value;

            document.getElementById('screen-setup').style.display = 'none';
            document.getElementById('screen-app').style.display = 'block';
            document.getElementById('app-nav').style.display = 'flex';
            renderWorkout();
        }

        function renderWorkout() {
            const container = document.getElementById('workout-container');
            container.innerHTML = "";
            
            const list = userRoutine[currentEnvironment][currentDay];
            
            list.forEach((ex, index) => {
                const card = document.createElement('div');
                card.className = "exercise-card";
                card.innerHTML = `
                    <div class="exercise-hero">
                        <div class="exercise-visual-box">${ex.vector || bonecoVectors.push}</div>
                        <div class="exercise-detail">
                            <h4>${index + 1}. ${ex.name}</h4>
                            <p>${ex.desc}</p>
                        </div>
                    </div>
                    <div class="exercise-footer">
                        <span class="meta-tag">${ex.meta}</span>
                        <div class="action-buttons">
                            <button class="btn-action-ex" style="color:var(--accent)" onclick="openGuideModal(${index})">📖 Execução</button>
                            <button class="btn-action-ex" style="color:var(--text-muted)" onclick="openEditModal(${index})">⚙️ Mudar</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openGuideModal(index) {
            const ex = userRoutine[currentEnvironment][currentDay][index];
            document.getElementById('guide-title').textContent = ex.name;
            document.getElementById('guide-vector-container').innerHTML = ex.vector || bonecoVectors.push;
            document.getElementById('guide-step1').textContent = ex.step1 || "Posicione o corpo de forma anatômica mantendo o alinhamento da coluna.";
            document.getElementById('guide-step2').textContent = ex.step2 || "Execute a contração muscular máxima de forma cadenciada.";
            document.getElementById('guide-step3').textContent = ex.step3 || "Evite usar embalos corporais para realizar o movimento.";
            
            document.getElementById('guide-modal').style.display = 'flex';
        }

        function closeGuideModal() { document.getElementById('guide-modal').style.display = 'none'; }

        function changeDay(day) {
            currentDay = day;
            document.querySelectorAll('.abc-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${day}`).classList.add('active');
            renderWorkout();
        }

        function changeEnvironment(env) {
            currentEnvironment = env;
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`nav-${env}`).classList.add('active');
            renderWorkout();
        }

        function openEditModal(index) {
            currentEditingIndex = index;
            const select = document.getElementById('modal-select-ex');
            select.innerHTML = "";

            const allExercises = [...exerciseBank.push, ...exerciseBank.pull, ...exerciseBank.legs];
            allExercises.forEach(e => {
                const op = document.createElement('option');
                op.value = e.name;
                op.textContent = e.name;
                select.appendChild(op);
            });

            const currentEx = userRoutine[currentEnvironment][currentDay][index];
            select.value = currentEx.name;
            document.getElementById('modal-input-meta').value = currentEx.meta;

            document.getElementById('edit-modal').style.display = 'flex';
        }

        function saveExerciseEdit() {
            const select = document.getElementById('modal-select-ex');
            const metaValue = document.getElementById('modal-input-meta').value;
            const allExercises = [...exerciseBank.push, ...exerciseBank.pull, ...exerciseBank.legs];
            
            const selectedEx = allExercises.find(e => e.name === select.value);

            if(selectedEx) {
                userRoutine[currentEnvironment][currentDay][currentEditingIndex] = {
                    ...selectedEx,
                    meta: metaValue
                };
                renderWorkout();
                closeModal();
            }
        }

        function closeModal() { document.getElementById('edit-modal').style.display = 'none'; }

        // TIMER
        let countdown;
        let timeRemaining = 60;
        function runTimer(sec) {
            clearInterval(countdown);
            timeRemaining = sec;
            const display = document.getElementById('timer-display');
            countdown = setInterval(() => {
                timeRemaining--;
                const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
                const s = (timeRemaining % 60).toString().padStart(2, '0');
                display.textContent = `${m}:${s}`;
                if(timeRemaining <= 0) {
                    clearInterval(countdown);
                    display.textContent = "GO!";
                }
            }, 1000);
        }
        function clearTimer() { clearInterval(countdown); document.getElementById('timer-display').textContent = "01:00"; }
    </script>
</body>
</html>
