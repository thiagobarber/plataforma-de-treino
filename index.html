<!-- MODAL DE EDIÇÃO -->
<div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-75 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl w-full max-w-sm p-6 shadow-2xl space-y-4">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
            <i class="fas fa-edit text-red-500"></i> Trocar Exercício
        </h3>
        <div class="space-y-3">
            <div>
                <!-- O segredo está no onclick="this.select()" que seleciona tudo ao clicar -->
                <input type="text" id="modal-exercise-name" list="global-exercises-list" onclick="this.select()" onfocus="this.select()" placeholder="Nome do exercício..." class="w-full p-3 rounded-lg bg-gray-800 border border-gray-700 text-white text-sm focus:outline-none">
                <datalist id="global-exercises-list">
                    <option value="Supino Reto com Barra"></option>
                    <option value="Agachamento Livre"></option>
                    <option value="Puxada Alta no Pulley"></option>
                </datalist>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <input type="text" id="modal-exercise-weight" placeholder="Carga" class="w-full p-3 rounded-lg bg-gray-800 border border-gray-700 text-white text-sm focus:outline-none">
                <input type="text" id="modal-exercise-reps" placeholder="Séries" class="w-full p-3 rounded-lg bg-gray-800 border border-gray-700 text-white text-sm focus:outline-none">
            </div>
        </div>
        <div class="flex gap-2.5 pt-2">
            <button onclick="closeEditModal()" class="flex-1 py-3 bg-gray-800 text-gray-300 rounded-xl text-xs font-bold uppercase">Cancelar</button>
            <button onclick="saveExerciseEdit()" class="flex-1 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-bold uppercase">Confirmar</button>
        </div>
    </div>
</div>
