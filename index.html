<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Fitness Pro Ultimate</title>
    <style>
        :root {
            --bg-main: #0f1115;
            --bg-card: #181c24;
            --bg-nav: #12141c;
            --primary: #ff3838;
            --primary-glow: rgba(255, 56, 56, 0.2);
            --accent: #00d2d3;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --border: #222834;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 90px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* CONFIGURAÇÃO / SETUP */
        .setup-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            margin-top: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .brand-logo {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .brand-logo span { color: var(--primary); }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%;
            background: var(--bg-main);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .btn-primary {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        /* APP PRINCIPAL */
        #screen-app { display: none; }

        .profile-widget {
            background: linear-gradient(135deg, #1e2430, #141821);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge-goal {
            background: rgba(0, 210, 211, 0.1);
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        /* SUB-MENU ABC */
        .abc-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .abc-btn {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .abc-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .section-title {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 15px 0;
            font-weight: 700;
        }

        .workout-block { display: none; }
        .workout-block.active { display: block; }

        /* CARDS DE EXERCÍCIO */
        .exercise-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .exercise-hero {
            display: flex;
            padding: 16px;
            gap: 16px;
            align-items: center;
        }

        .exercise-visual {
            width: 70px;
            height: 70px;
            background: var(--bg-main);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            border: 1px solid var(--border);
        }

        .stick-man {
            width: 5px;
            height: 20px;
            background: #d1d8e0;
            position: relative;
            border-radius: 2px;
        }

        .stick-man::before {
            content: '';
            position: absolute;
            top: -9px; left: -2px;
            width: 9px; height: 9px;
            background: var(--primary);
            border-radius: 50%;
        }

        /* Animações CSS Base */
        .anim-push .stick-man { animation: pro-push 2s infinite ease-in-out; }
        .anim-pull .stick-man { animation: pro-pull 2s infinite ease-in-out; }
        .anim-squat .stick-man { animation: pro-squat 2.5s infinite ease-in-out; }

        @keyframes pro-push { 0%, 100% { transform: rotate(90deg) translateY(-3px); } 50% { transform: rotate(90deg) translateY(6px); } }
        @keyframes pro-pull { 0%, 100% { transform: translateY(6px); } 50% { transform: translateY(-6px); } }
        @keyframes pro-squat { 0%, 100% { transform: translateY(-3px) scaleY(1); } 50% { transform: translateY(8px) scaleY(0.75); } }

        .exercise-detail { flex: 1; }
        .exercise-detail h4 { font-size: 1.05rem; font-weight: 600; margin-bottom: 4px; }
        .exercise-detail p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.3; }

        .exercise-footer {
            background: rgba(0, 0, 0, 0.15);
            padding: 10px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .meta-tag { font-size: 0.8rem; font-weight: 700; color: var(--primary); }
        
        .btn-edit-ex {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* MODAL DE EDIÇÃO */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 450px;
        }

        /* TIMER */
        .hub-timer {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            margin-top: 25px;
        }

        .timer-val { font-size: 2.5rem; font-weight: 800; font-family: monospace; margin: 5px 0; }
        .timer-actions { display: flex; gap: 8px; justify-content: center; }

        .btn-sec {
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: white;
            padding: 8px 16px;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
        }

        /* NAV INFERIOR */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 70px;
            background: var(--bg-nav);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            gap: 4px;
        }

        .nav-item.active { color: var(--primary); }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
    </style>
</head>
<body>

    <div class="container">
        <!-- TELA SETUP -->
        <div id="screen-setup" class="setup-card">
            <div class="brand-logo">Hybrid<span>Fitness</span></div>
            <form onsubmit="initApp(event)">
                <div class="form-group">
                    <label>Nome do Atleta</label>
                    <input type="text" id="in-name" required placeholder="Digite seu nome">
                </div>
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Peso (kg)</label>
                        <input type="number" id="in-weight" required placeholder="78">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Altura (m)</label>
                        <input type="number" id="in-height" step="0.01" required placeholder="1.64">
                    </div>
                </div>
                <div class="form-group">
                    <label>Objetivo</label>
                    <select id="in-goal">
                        <option value="Hipertrofia">💪 Hipertrofia Acelerada</option>
                        <option value="Definição">🔥 Queima & Definição</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Montar Painel de Treino</button>
            </form>
        </div>

        <!-- APP PRINCIPAL -->
        <div id="screen-app">
            <div class="profile-widget">
                <div>
                    <h3 id="user-name">Atleta</h3>
                    <p id="user-stats">00kg | 0.00m</p>
                </div>
                <div class="badge-goal" id="user-goal">Objetivo</div>
            </div>

            <!-- Seleção de Ficha (A, B, C) -->
            <div class="abc-tabs">
                <button class="abc-btn active" id="btn-A" onclick="changeDay('A')">TREINO A</button>
                <button class="abc-btn" id="btn-B" onclick="changeDay('B')">TREINO B</button>
                <button class="abc-btn" id="btn-C" onclick="changeDay('C')">TREINO C</button>
            </div>

            <div id="workout-container">
                <!-- Injetado dinamicamente via JS -->
            </div>

            <!-- CRONÔMETRO -->
            <div class="hub-timer">
                <span style="font-size: 0.75rem; color: var(--text-muted); font-weight:700; text-transform:uppercase;">Recuperação</span>
                <div class="timer-val" id="timer-display">01:00</div>
                <div class="timer-actions">
                    <button class="btn-sec" onclick="runTimer(60)">60s</button>
                    <button class="btn-sec" onclick="runTimer(90)">90s</button>
                    <button class="btn-sec" style="color: var(--primary)" onclick="clearTimer()">Reset</button>
                </div>
            </div>
        </div>
    </div>

    <!-- NAVEGAÇÃO INTERNA AMBIENTE -->
    <div class="bottom-nav" id="app-nav" style="display: none;">
        <button class="nav-item active" id="nav-casa" onclick="changeEnvironment('casa')">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Casa
        </button>
        <button class="nav-item" id="nav-academia" onclick="changeEnvironment('academia')">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg> Academia
        </button>
    </div>

    <!-- MODAL DE EDIÇÃO DE EXERCÍCIO -->
    <div class="modal" id="edit-modal">
        <div class="modal-content">
            <h3 style="margin-bottom: 15px; color: var(--primary);">Substituir Exercício</h3>
            <div class="form-group">
                <label>Selecione o novo exercício</label>
                <select id="modal-select-ex"></select>
            </div>
            <div class="form-group">
                <label>Séries e Repetições</label>
                <input type="text" id="modal-input-meta">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn-primary" style="flex: 1;" onclick="saveExerciseEdit()">Salvar</button>
                <button class="btn-sec" onclick="closeModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        // BANCO DE DADOS INTEGRADO DE EXERCÍCIOS COMPLETO (EDITÁVEL)
        const exerciseBank = {
            push: [
                { name: "Flexão de Braço Padrão", desc: "Mantenha o corpo reto e desça até o peito quase tocar o chão.", anim: "anim-push" },
                { name: "Supino Reto com Barra", desc: "Desça a barra controladamente até o peito e empurre com força explosiva.", anim: "anim-push" },
                { name: "Supino Inclinado com Halteres", desc: "Foco na porção superior do peito. Angulação de 30 a 45 graus.", anim: "anim-push" },
                { name: "Desenvolvimento de Ombros", desc: "Empurre os halteres acima da cabeça estendendo os braços.", anim: "anim-push" },
                { name: "Elevação Lateral", desc: "Suba os braços até a linha dos ombros focando na lateral do deltoide.", anim: "anim-push" },
                { name: "Tríceps Testa", desc: "Deitado, flexione apenas os cotovelos trazendo a barra até a testa.", anim: "anim-push" },
                { name: "Flexão Diamante (Casa)", desc: "Mãos juntas formando um diamante, foco total no tríceps.", anim: "anim-push" },
                { name: "Mergulho no Banco", desc: "Apoie as mãos em uma cadeira e desça o quadril flexionando os cotovelos.", anim: "anim-push" }
            ],
            pull: [
                { name: "Barra Fixa Pronada", desc: "Puxe o corpo para cima até o queixo passar a linha da barra.", anim: "anim-pull" },
                { name: "Puxada Alta no Pulley", desc: "Puxe a barra em direção ao peitoral esmagando as costas.", anim: "anim-pull" },
                { name: "Remada Baixa Triângulo", desc: "Mantenha a postura reta e puxe a carga em direção ao abdômen.", anim: "anim-pull" },
                { name: "Remada Curvada", desc: "Incline o tronco à frente e puxe a barra trabalhando toda a dorsal.", anim: "anim-pull" },
                { name: "Crucifixo Invertido", desc: "Abra os braços para trás focando na porção posterior do ombro.", anim: "anim-pull" },
                { name: "Rosca Direta", desc: "Flexão de cotovelos com barra ou halteres isolando o bíceps.", anim: "anim-pull" },
                { name: "Rosca Martelo", desc: "Pegada neutra, excelente para trabalhar bíceps e antebraço.", anim: "anim-pull" },
                { name: "Remada com Elástico (Casa)", desc: "Prenda o elástico e puxe simulando o movimento de remada.", anim: "anim-pull" }
            ],
            legs: [
                { name: "Agachamento Livre", desc: "Desça o quadril para trás mantendo os joelhos alinhados.", anim: "anim-squat" },
                { name: "Agachamento Búlgaro", desc: "Um pé apoiado atrás. Desça verticalmente concentrando a força na perna da frente.", anim: "anim-squat" },
                { name: "Leg Press 45°", desc: "Empurre a plataforma mantendo a lombar totalmente apoiada no banco.", anim: "anim-squat" },
                { name: "Cadeira Extensora", desc: "Extensão completa das pernas travando bem o quadríceps no topo.", anim: "anim-squat" },
                { name: "Mesa Flexora", desc: "Flexão de pernas focando diretamente na região posterior da coxa.", anim: "anim-squat" },
                { name: "Elevação Pélvica", desc: "Eleve o quadril contraindo ao máximo os glúteos e abdômen.", anim: "anim-squat" },
                { name: "Gêmeos em Pé (Panturrilha)", desc: "Suba na ponta dos pés buscando a maior amplitude possível.", anim: "anim-squat" },
                { name: "Afundo Caminhando", desc: "Dê passos longos descendo o joelho de trás até quase tocar o chão.", anim: "anim-squat" }
            ]
        };

        // ESTRUTURA ATUAL DE TREINO DO USUÁRIO (MUTÁVEL)
        let currentEnvironment = "casa";
        let currentDay = "A";
        let currentEditingIndex = null;

        let userRoutine = {
            casa: {
                A: [
                    { ...exerciseBank.push[0], meta: "4 SÉRIES x FALHA" },
                    { ...exerciseBank.push[6], meta: "3 SÉRIES x 12 REPS" },
                    { ...exerciseBank.pull[0], meta: "4 SÉRIES x 8-12 REPS" },
                    { ...exerciseBank.pull[7], meta: "4 SÉRIES x 15 REPS" },
                    { ...exerciseBank.push[7], meta: "3 SÉRIES x 15 REPS" }
                ],
                B: [
                    { ...exerciseBank.legs[1], meta: "4 SÉRIES x 12 REPS" },
                    { ...exerciseBank.legs[0], meta: "4 SÉRIES x 20 REPS" },
                    { ...exerciseBank.legs[5], meta: "4 SÉRIES x 15 REPS" },
                    { ...exerciseBank.legs[7], meta: "3 SÉRIES x 20 PASSOS" },
                    { ...exerciseBank.legs[6], meta: "4 SÉRIES x 20 REPS" }
                ],
                C: [
                    { name: "Burpees Infinitos", desc: "Salte, agache e faça uma flexão completa. Cardio intenso.", anim: "anim-push", meta: "4 SÉRIES x 12 REPS" },
                    { name: "Escalador (Mountain Climbers)", desc: "Posição de prancha trazendo os joelhos alternadamente ao peito.", anim: "anim-push", meta: "4 SÉRIES x 45 SEG" },
                    { name: "Agachamento com Salto", desc: "Agache e suba executando um salto vertical explosivo.", anim: "anim-squat", meta: "4 SÉRIES x 15 REPS" },
                    { name: "Abdominal Remador", desc: "Estique o corpo todo e suba abraçando os joelhos.", anim: "anim-pull", meta: "4 SÉRIES x 20 REPS" },
                    { ...exerciseBank.legs[6], meta: "4 SÉRIES x 25 REPS" }
                ]
            },
            academia: {
                A: [
                    { ...exerciseBank.push[1], meta: "4 SÉRIES x 10 REPS" },
                    { ...exerciseBank.push[2], meta: "3 SÉRIES x 12 REPS" },
                    { ...exerciseBank.push[3], meta: "4 SÉRIES x 10 REPS" },
                    { ...exerciseBank.push[4], meta: "4 SÉRIES x 12 REPS" },
                    { ...exerciseBank.push[5], meta: "4 SÉRIES x 12 REPS" }
                ],
                B: [
                    { ...exerciseBank.pull[1], meta: "4 SÉRIES x 10 REPS" },
                    { ...exerciseBank.pull[2], meta: "4 SÉRIES x 12 REPS" },
                    { ...exerciseBank.pull[3], meta: "3 SÉRIES x 10 REPS" },
                    { ...exerciseBank.pull[4], meta: "3 SÉRIES x 12 REPS" },
                    { ...exerciseBank.pull[5], meta: "4 SÉRIES x 10 REPS" }
                ],
                C: [
                    { ...exerciseBank.legs[0], meta: "4 SÉRIES x 8-10 REPS" },
                    { ...exerciseBank.legs[2], meta: "4 SÉRIES x 12 REPS" },
                    { ...exerciseBank.legs[3], meta: "3 SÉRIES x 12 REPS" },
                    { ...exerciseBank.legs[4], meta: "4 SÉRIES x 12 REPS" },
                    { ...exerciseBank.legs[5], meta: "4 SÉRIES x 10 REPS" },
                    { ...exerciseBank.legs[6], meta: "4 SÉRIES x 20 REPS" }
                ]
            }
        };

        function initApp(e) {
            e.preventDefault();
            document.getElementById('user-name').textContent = document.getElementById('in-name').value;
            document.getElementById('user-stats').textContent = `${document.getElementById('in-weight').value} kg | ${document.getElementById('in-height').value} m`;
            document.getElementById('user-goal').textContent = document.getElementById('in-goal').value;

            document.getElementById('screen-setup').style.display = 'none';
            document.getElementById('screen-app').style.display = 'block';
            document.getElementById('app-nav').style.display = 'flex';
            renderWorkout();
        }

        // REDERIZAÇÃO DA GRADE DE EXERCÍCIOS COMPLETA
        function renderWorkout() {
            const container = document.getElementById('workout-container');
            container.innerHTML = "";
            
            const list = userRoutine[currentEnvironment][currentDay];
            
            list.forEach((ex, index) => {
                const card = document.createElement('div');
                card.className = "exercise-card";
                card.innerHTML = `
                    <div class="exercise-hero">
                        <div class="exercise-visual ${ex.anim}"><div class="stick-man"></div></div>
                        <div class="exercise-detail">
                            <h4>${index + 1}. ${ex.name}</h4>
                            <p>${ex.desc}</p>
                        </div>
                    </div>
                    <div class="exercise-footer">
                        <span class="meta-tag">${ex.meta}</span>
                        <button class="btn-edit-ex" onclick="openEditModal(${index})">⚙️ Editar Treino</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function changeDay(day) {
            currentDay = day;
            document.querySelectorAll('.abc-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${day}`).classList.add('active');
            renderWorkout();
        }

        function changeEnvironment(env) {
            currentEnvironment = env;
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`nav-${env}`).classList.add('active');
            renderWorkout();
        }

        // SISTEMA DE EDIÇÃO DINÂMICA (MODAL)
        function openEditModal(index) {
            currentEditingIndex = index;
            const select = document.getElementById('modal-select-ex');
            select.innerHTML = "";

            // Junta todas as categorias para disponibilizar todos os exercícios cadastrados
            const allExercises = [...exerciseBank.push, ...exerciseBank.pull, ...exerciseBank.legs];
            allExercises.forEach(e => {
                const op = document.createElement('option');
                op.value = e.name;
                op.textContent = e.name;
                select.appendChild(op);
            });

            const currentEx = userRoutine[currentEnvironment][currentDay][index];
            select.value = currentEx.name;
            document.getElementById('modal-input-meta').value = currentEx.meta;

            document.getElementById('edit-modal').style.display = 'flex';
        }

        function saveExerciseEdit() {
            const select = document.getElementById('modal-select-ex');
            const metaValue = document.getElementById('modal-input-meta').value;
            const allExercises = [...exerciseBank.push, ...exerciseBank.pull, ...exerciseBank.legs];
            
            const selectedEx = allExercises.find(e => e.name === select.value);

            if(selectedEx) {
                userRoutine[currentEnvironment][currentDay][currentEditingIndex] = {
                    ...selectedEx,
                    meta: metaValue
                };
                renderWorkout();
                closeModal();
            }
        }

        function closeModal() { document.getElementById('edit-modal').style.display = 'none'; }

        // TIMER
        let countdown;
        let timeRemaining = 60;
        function runTimer(sec) {
            clearInterval(countdown);
            timeRemaining = sec;
            const display = document.getElementById('timer-display');
            countdown = setInterval(() => {
                timeRemaining--;
                const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
                const s = (timeRemaining % 60).toString().padStart(2, '0');
                display.textContent = `${m}:${s}`;
                if(timeRemaining <= 0) {
                    clearInterval(countdown);
                    display.textContent = "GO!";
                }
            }, 1000);
        }
        function clearTimer() { clearInterval(countdown); document.getElementById('timer-display').textContent = "01:00"; }
    </script>
</body>
</html>
