<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hybrid Fitness Pro</title>
    
    <!-- FAVICON INTEGRADO -->
    <link rel="icon" type="image/png" href="https://i.imgur.com/WUGgjpt.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Custom Scrollbar para visual Premium */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f1115;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff3838;
            border-radius: 10px;
        }
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-[#0f1115] text-white font-sans min-h-screen flex flex-col antialiased selection:bg-[#ff3838] selection:text-white">

    <!-- HEADER / NAVIGATION -->
    <header class="bg-[#181c24] border-b border-gray-800 sticky top-0 z-50 px-4 py-3 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-3">
            <img src="https://i.imgur.com/WUGgjpt.png" alt="Logo" class="w-8 h-8 object-contain rounded-lg shadow-md">
            <span class="font-black text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400">HYBRID<span class="text-[#ff3838]">FIT</span></span>
        </div>
        <div class="flex items-center gap-4">
            <button id="envToggle" class="bg-gray-800 hover:bg-gray-700 text-sm font-bold px-3 py-1.5 rounded-full border border-gray-700 transition-all flex items-center gap-2 cursor-pointer active:scale-95">
                <i class="fa-solid fa-house text-emerald-400" id="envIcon"></i>
                <span id="envText">HOME</span>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 max-w-md w-full mx-auto px-4 py-6 space-y-6 pb-24">
        
        <!-- DASHBOARD RESUME -->
        <section class="bg-[#181c24] rounded-2xl p-4 border border-gray-800 shadow-xl space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-xs font-black tracking-widest text-gray-400 uppercase">Progresso Diário</h2>
                <span class="text-xs font-bold text-[#ff3838] bg-[#ff3838]/10 px-2.5 py-1 rounded-full border border-[#ff3838]/20" id="dateDisplay">Hoje</span>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-[#0f1115] p-3 rounded-xl border border-gray-800/50 flex items-center gap-3">
                    <div class="w-10 h-10 bg-[#ff3838]/10 rounded-lg flex items-center justify-center text-[#ff3838]">
                        <i class="fa-solid fa-fire text-lg"></i>
                    </div>
                    <div>
                        <p class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Séries Concluídas</p>
                        <p class="text-xl font-black text-white" id="setsCounter">0</p>
                    </div>
                </div>
                <div class="bg-[#0f1115] p-3 rounded-xl border border-gray-800/50 flex items-center gap-3">
                    <div class="w-10 h-10 bg-cyan-500/10 rounded-lg flex items-center justify-center text-cyan-400">
                        <i class="fa-solid fa-weight-scale text-lg"></i>
                    </div>
                    <div>
                        <p class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Carga Total</p>
                        <p class="text-xl font-black text-white" id="weightCounter">0 <span class="text-xs text-gray-400">kg</span></p>
                    </div>
                </div>
            </div>
        </section>

        <!-- TIMER SECTION -->
        <section class="bg-[#181c24] rounded-2xl p-4 border border-gray-800 shadow-xl flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-amber-500/10 rounded-xl flex items-center justify-center text-amber-400 border border-amber-500/20 animate-pulse">
                    <i class="fa-solid fa-stopwatch text-xl"></i>
                </div>
                <div>
                    <h3 class="text-sm font-black text-white uppercase tracking-wide">Descanso Inteligente</h3>
                    <p class="text-xs text-gray-400" id="timerStatus">Pronto para iniciar</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span id="timerDisplay" class="font-mono text-2xl font-black tracking-wider text-amber-400 bg-[#0f1115] px-3 py-1.5 rounded-xl border border-gray-800">01:30</span>
                <button id="timerBtn" class="bg-amber-500 hover:bg-amber-600 text-[#0f1115] w-10 h-10 rounded-xl flex items-center justify-center transition-all cursor-pointer active:scale-95 shadow-md shadow-amber-500/20">
                    <i class="fa-solid fa-play" id="timerBtnIcon"></i>
                </button>
            </div>
        </section>

        <!-- EXERCISES LIST -->
        <section class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-sm font-black tracking-widest text-gray-400 uppercase flex items-center gap-2">
                    <i class="fa-solid fa-dumbbell text-[#ff3838]"></i> Rotina do Dia
                </h2>
                <span class="text-xs text-gray-500 font-bold" id="routineType">Calistenia & Peso Corporal</span>
            </div>
            
            <div id="exerciseContainer" class="space-y-3">
                <!-- Exercícios injetados via JavaScript dinamicamente -->
            </div>
        </section>

    </main>

    <!-- BOTTOM NAVBAR -->
    <nav class="bg-[#181c24]/95 backdrop-blur-md border-t border-gray-800 fixed bottom-0 left-0 right-0 z-50 px-6 py-2 shadow-2xl">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <button class="flex flex-col items-center gap-1 text-[#ff3838] transition-all cursor-pointer">
                <i class="fa-solid fa-house-chimney text-lg"></i>
                <span class="text-[10px] font-black tracking-wider uppercase">Treino</span>
            </button>
            <button onclick="alert('Histórico e Evolução de Métricas em breve!')" class="flex flex-col items-center gap-1 text-gray-500 hover:text-gray-300 transition-all cursor-pointer">
                <i class="fa-solid fa-chart-line text-lg"></i>
                <span class="text-[10px] font-bold tracking-wider uppercase">Métricas</span>
            </button>
            <button onclick="alert('Perfil e Configurações da Conta em breve!')" class="flex flex-col items-center gap-1 text-gray-500 hover:text-gray-300 transition-all cursor-pointer">
                <i class="fa-solid fa-user text-lg"></i>
                <span class="text-[10px] font-bold tracking-wider uppercase">Perfil</span>
            </button>
        </div>
    </nav>

    <!-- CORE JAVASCRIPT LOGIC -->
    <script>
        // Data Handling
        const exercisesData = {
            home: [
                { id: 1, name: "Flexões de Braço (Push-Ups)", target: "Peito e Tríceps", defaultVolume: "4 séries de 20 reps", icon: "fa-person-running" },
                { id: 2, name: "Barra Fixa (Pull-Ups)", target: "Costas e Bíceps", defaultVolume: "4 séries de 10 reps", icon: "fa-dumbbell" },
                { id: 3, name: "Agachamento Livre (Squats)", target: "Pernas e Glúteos", defaultVolume: "4 séries de 25 reps", icon: "fa-child" },
                { id: 4, name: "Abdominal Supra (Crunches)", target: "Abdômen", defaultVolume: "4 séries de 20 reps", icon: "fa-person-rays" }
            ],
            gym: [
                { id: 5, name: "Supino Reto com Barra", target: "Peito Superior", defaultVolume: "4 séries x 10 reps", icon: "fa-dumbbell" },
                { id: 6, name: "Puxada Alta na Polia", target: "Dorsais e Costas", defaultVolume: "4 séries x 12 reps", icon: "fa-align-justify" },
                { id: 7, name: "Leg Press 45º", target: "Quadríceps e Gêmeos", defaultVolume: "4 séries x 10 reps", icon: "fa-wheelchair" },
                { id: 8, name: "Rosca Direta Halteres", target: "Bíceps Isolação", defaultVolume: "3 séries x 12 reps", icon: "fa-hand-fist" }
            ]
        };

        let currentEnv = 'home';
        let totalSets = 0;
        let totalWeight = 0;
        
        // Timer Variables
        let timerDuration = 90; // 1 min 30s
        let timerInterval = null;
        let isTimerRunning = false;

        // DOM Elements
        const envToggle = document.getElementById('envToggle');
        const envIcon = document.getElementById('envIcon');
        const envText = document.getElementById('envText');
        const routineType = document.getElementById('routineType');
        const exerciseContainer = document.getElementById('exerciseContainer');
        const setsCounter = document.getElementById('setsCounter');
        const weightCounter = document.getElementById('weightCounter');
        const timerDisplay = document.getElementById('timerDisplay');
        const timerBtn = document.getElementById('timerBtn');
        const timerBtnIcon = document.getElementById('timerBtnIcon');
        const timerStatus = document.getElementById('timerStatus');
        const dateDisplay = document.getElementById('dateDisplay');

        // Set Real Date
        const options = { weekday: 'long', day: 'numeric', month: 'short' };
        dateDisplay.innerText = new Date().toLocaleDateString('pt-BR', options);

        // Render Exercises
        function renderExercises() {
            exerciseContainer.innerHTML = '';
            const list = exercisesData[currentEnv];
            
            list.forEach(ex => {
                const card = document.createElement('div');
                card.className = "bg-[#181c24] rounded-2xl p-4 border border-gray-800 shadow-md space-y-3 transition-all hover:border-gray-700";
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 bg-gray-800 rounded-xl flex items-center justify-center text-gray-400">
                                <i class="fa-solid ${ex.icon}"></i>
                            </div>
                            <div>
                                <h4 class="text-sm font-black text-white">${ex.name}</h4>
                                <p class="text-[11px] text-gray-500 font-bold">${ex.target} • <span class="text-[#ff3838]/80">${ex.defaultVolume}</span></p>
                            </div>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2 pt-2 border-t border-gray-800/50 items-end">
                        <div>
                            <label class="text-[9px] font-black text-gray-500 uppercase tracking-wider block mb-1">Carga (kg)</label>
                            <input type="number" placeholder="0" class="w-full bg-[#0f1115] border border-gray-800 rounded-xl px-3 py-1.5 text-sm font-bold text-white focus:outline-none focus:border-cyan-500 text-center" id="weight-${ex.id}">
                        </div>
                        <div>
                            <label class="text-[9px] font-black text-gray-500 uppercase tracking-wider block mb-1">Reps Feitas</label>
                            <input type="number" placeholder="10" class="w-full bg-[#0f1115] border border-gray-800 rounded-xl px-3 py-1.5 text-sm font-bold text-white focus:outline-none focus:border-cyan-500 text-center" id="reps-${ex.id}">
                        </div>
                        <button onclick="logSet(${ex.id})" class="bg-[#ff3838] hover:bg-red-600 text-white font-black text-xs py-2.5 rounded-xl transition-all cursor-pointer active:scale-95 shadow-md shadow-red-500/10 uppercase tracking-wider flex items-center justify-center gap-1">
                            <i class="fa-solid fa-plus"></i> Set
                        </button>
                    </div>
                `;
                exerciseContainer.appendChild(card);
            });
        }

        // Toggle Environment
        envToggle.addEventListener('click', () => {
            if(currentEnv === 'home') {
                currentEnv = 'gym';
                envText.innerText = "ACADEMIA";
                envIcon.className = "fa-solid fa-dumbbell text-[#ff3838]";
                routineType.innerText = "Hipertrofia & Cargas Máximas";
            } else {
                currentEnv = 'home';
                envText.innerText = "HOME";
                envIcon.className = "fa-solid fa-house text-emerald-400";
                routineType.innerText = "Calistenia & Peso Corporal";
            }
            renderExercises();
        });

        // Log Set Action
        window.logSet = function(id) {
            const weightInput = document.getElementById(`weight-${id}`);
            const weightVal = parseFloat(weightInput.value) || 0;
            
            totalSets++;
            totalWeight += weightVal;
            
            setsCounter.innerText = totalSets;
            weightCounter.innerText = totalWeight;

            // Feedback Visual Rápido e Ativação Automática do Timer de Descanso
            startTimer();
        };

        // Smart Rest Timer Engine
        function startTimer() {
            clearInterval(timerInterval);
            timerDuration = 90; 
            isTimerRunning = true;
            timerStatus.innerText = "Em descanso...";
            timerStatus.className = "text-xs text-amber-400 font-bold";
            timerBtnIcon.className = "fa-solid fa-rotate-left";
            
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timerDuration--;
                updateTimerDisplay();

                if(timerDuration <= 0) {
                    clearInterval(timerInterval);
                    isTimerRunning = false;
                    timerStatus.innerText = "Descanso concluído!";
                    timerStatus.className = "text-xs text-emerald-400 font-bold";
                    timerBtnIcon.className = "fa-solid fa-play";
                    
                    // Alerta de Vibração se suportado no mobile
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timerDuration / 60);
            const seconds = timerDuration % 60;
            timerDisplay.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        timerBtn.addEventListener('click', () => {
            if(isTimerRunning) {
                // Reset manual
                clearInterval(timerInterval);
                isTimerRunning = false;
                timerDuration = 90;
                updateTimerDisplay();
                timerStatus.innerText = "Timer resetado";
                timerStatus.className = "text-xs text-gray-400";
                timerBtnIcon.className = "fa-solid fa-play";
            } else {
                startTimer();
            }
        });

        // Initial Load
        renderExercises();
    </script>
</body>
</html>
